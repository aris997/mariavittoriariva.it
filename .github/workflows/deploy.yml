name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-s3
  cancel-in-progress: false

env:
  BUCKET: mariavittoriariva.it
  CACHE_IMMUTABLE: "public, max-age=31536000, immutable"

defaults:
  run:
    shell: bash

jobs:
  # No secrets in this job: npm dependencies never run next to the AWS keys.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      # The root sync in the deploy job runs with --delete: a missing page would be removed from the bucket.
      - name: Check build output
        run: |
          for f in index.html error.html; do
            test -s "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Resolve website endpoint
        env:
          REGION: ${{ vars.AWS_REGION }}
        run: |
          : "${REGION:?repository variable AWS_REGION is not set (gh variable set AWS_REGION --body <region>)}"
          # Legacy regions use s3-website-<region>, all others s3-website.<region>
          # (https://docs.aws.amazon.com/general/latest/gr/s3.html#s3_website_region_endpoints).
          case "$REGION" in
            us-east-1|us-west-1|us-west-2|eu-west-1|ap-southeast-1|ap-southeast-2|ap-northeast-1|sa-east-1|us-gov-west-1) sep=- ;;
            *) sep=. ;;
          esac
          echo "WEBSITE_URL=http://${BUCKET}.s3-website${sep}${REGION}.amazonaws.com" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Order: new hashed assets -> HTML that references them -> prune old assets.
      # Content-Type comes from the CLI's bundled Python mimetypes (+ /etc/mime.types), which maps
      # js/css/woff2/svg/pdf/jpg correctly; only HTML is forced, to add the charset.
      # Asset names are content-hashed, so an existing key with the same size is the same file.
      - name: Upload hashed assets
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --size-only --no-progress \
            --cache-control "$CACHE_IMMUTABLE"

      - name: Upload root files and HTML
        run: |
          aws s3 sync dist "s3://$BUCKET" \
            --delete --no-progress \
            --exclude "assets/*" --exclude "*.html" \
            --cache-control "no-cache"
          aws s3 sync dist "s3://$BUCKET" \
            --delete --no-progress \
            --exclude "*" --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache"

      # Every local asset is already in the bucket, so with --size-only this only deletes.
      - name: Prune stale assets
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --delete --size-only --no-progress \
            --cache-control "$CACHE_IMMUTABLE"

      - name: Smoke test website endpoint
        run: |
          check() {
            out=$(curl -sS --retry 3 --retry-all-errors --max-time 20 -o /dev/null \
              -w '%{http_code} %{content_type}' "$WEBSITE_URL/$1")
            echo "/$1 -> $out"
            [[ $out == 200\ $2 ]] || { echo "::error::/$1: expected 200 $2, got $out"; return 1; }
          }
          check "" "text/html; charset=utf-8"
          for spec in "js:*javascript" "css:text/css" "woff2:font/woff2"; do
            f=$(find dist/assets -name "*.${spec%%:*}" -print -quit)
            if [[ -n $f ]]; then check "${f#dist/}" "${spec#*:}"; fi
          done

      - name: Job summary
        run: |
          {
            echo "### Deployed \`${GITHUB_SHA::7}\` to \`s3://$BUCKET\`"
            echo
            echo "- Site: http://$BUCKET/"
            echo "- S3 website endpoint: $WEBSITE_URL/"
          } >> "$GITHUB_STEP_SUMMARY"
